server: 8081
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/hiver_support}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      embedding_dimension: 768

openai:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL}
  chat:
    model: ${GROQ_CHAT_MODEL:openai/gpt-oss-20b}
    temperature: 0.2

classification:
  input-file: data/working_pool.csv
  output-file: data/working_pool_classified1.csv
  batch-size: 10
  retry-count: 2
  delay-seconds: 30

retrieval:
  embedding:
    provider: ${EMBEDDING_PROVIDER}
    base-url: ${EMBEDDING_BASE_URL}
    api-key: ${EMBEDDING_API_KEY}
    model: ${EMBEDDING_MODEL}
    dimension: ${EMBEDDING_DIMENSION}
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS}
  ingestion:
    enabled: false
    input-file: data/working_pool_classified1.csv
    batch-size: 1
    delay-milliseconds: 250
    max-retries: 3
  evaluation:
    gold-file: data/200_cases_for_gold_intent_labeled.csv

response-generation:
  retry-count: 2
  retry-delay-seconds: 5
